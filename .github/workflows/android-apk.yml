name: 云端打 APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 准备 Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle | head -1)
          echo "name=${VERSION:-dev}" >> "$GITHUB_OUTPUT"

      # 没有配置签名密钥时跳过，改用下面的调试版构建，保证每次都能拿到 APK。
      - name: 还原签名密钥
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          test -s app/keystore.jks

      - name: 构建正式版 APK
        if: env.KEYSTORE_BASE64 != ''
        run: gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'my-key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '123456' }}

      - name: 构建调试版 APK（缺少签名密钥）
        if: env.KEYSTORE_BASE64 == ''
        run: gradle assembleDebug

      - name: 构建结果
        run: |
          ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null || ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HistoryVideo-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 发布 Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 历史视频生成器 v${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          body: |
            自动构建的 APK，可直接覆盖安装。

            - 版本：${{ steps.version.outputs.name }}
            - 提交：${{ github.sha }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
