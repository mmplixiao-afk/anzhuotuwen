apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.historyvideo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.historyvideo.app'
        minSdk 29
        targetSdk 35
        versionCode 35
        versionName '0.5.4'
    }

    // 👇 新增的签名配置块
    signingConfigs {
        release {
            // 优先读取云端环境变量，本地没有时自动回退使用默认值和本地文件
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "123456"
            keyAlias System.getenv("KEY_ALIAS") ?: "my-key"
            keyPassword System.getenv("KEY_PASSWORD") ?: "123456"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release // 👈 这里是新增的引用
            minifyEnabled false
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.06.01')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-video:8.1.9'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

tasks.withType(JavaCompile).configureEach {
    options.fork = false
}
